<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Kilter Board Difficulty Predictor</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
        <h1>Kilter Board Original 12x12 (with footholds) Difficulty Predictor</h1>
        <svg id="climbSvg" height="500" width="500" viewbox="0 0 1080 1170" xmlns="http://www.w3.org/2000/svg">
            <image href="../images/bigHolds.png"></image>
            <image href="../images/smallHolds.png"></image>
        </svg>
        <br>
        <h3>Board functions</h3>
        <button id="clearBoard" onclick="clearBoard()">Clear board</button>
        <br>
        <label for="climbString">Climb string:</label>
        <input type="text" id="climbString" name="climbString">
        <button id="applyClimbString" onclick="applyClimbString()">Apply climb string</button>
        <hr>
        <h3>Prediction functionality</h3>
        <!-- <form action="/getPrediction" method="post"> -->
            <input type="hidden" id="climb_string" name="climb_string">
            <label for="angle">Angle: </label>
            <input type="text" id="angle" name="angle">
            <br>
            <button id="submitClimbButton">Submit prediction</button>
        <!-- </form> -->
        <div id="predictionContainer">
            The prediction is: <span id="prediction"></span>
        </div>
        <script src="script.js" async defer></script>
    </body>
</html>
